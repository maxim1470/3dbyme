<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3DByMe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0b0f17;
    color:white;
}

html{
    scroll-behavior:smooth;
}

nav{
    position:sticky;
    width:100%;
    top:0;
    left:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 7%;
    background:rgba(11,15,23,.92);
    backdrop-filter:blur(12px);
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:30px;
    font-weight:800;
    background:linear-gradient(90deg,#00bfff,#00ff95);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.hero{
    min-height:calc(100vh - 70px);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:60px 20px;
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8)),
    url('https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcQafSD5MwfmhzgVNoVt3mz9zFnAUo2mNxifQHhpAnln6m87gCNwfoQBGQho56lBxwAM3Yg33jOxzhkyq6Slru0nRQJ33VNYhsF-iRV8pxeO4zqpGGrJm_xC&usqp=CAc') center/cover;
}

.hero-badge{
    display:inline-block;
    background:rgba(0,191,255,.12);
    border:1px solid rgba(0,191,255,.3);
    color:#00bfff;
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:7px 18px;
    border-radius:100px;
    margin-bottom:28px;
}

.hero h1{
    font-size:76px;
    font-weight:800;
    line-height:1.05;
    letter-spacing:-.02em;
    margin-bottom:22px;
}

.hero h1 span{
    background:linear-gradient(90deg,#00bfff,#00ff95);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    max-width:600px;
    color:#b0b8c8;
    font-size:19px;
    line-height:1.75;
}

.section-title{
    text-align:center;
    font-size:52px;
    margin-bottom:60px;
}

.gallery{
    padding:100px 7%;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;
}

.card{
    background:#121826;
    border-radius:24px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    transition:.35s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 18px 45px rgba(0,191,255,.18);
}

.card img,
.card video{
    width:100%;
    display:block;
    max-height:420px;
    object-fit:cover;
    background:black;
}

.card-content{
    padding:25px;
}

.card-content h3{
    font-size:28px;
    margin-bottom:12px;
}

.card-content p{
    color:#c5c5c5;
    line-height:1.7;
}

footer{
    text-align:center;
    padding:45px;
    border-top:1px solid rgba(255,255,255,.08);
    color:#909090;
    margin-top:70px;
}

.loading{
    text-align:center;
    color:#9f9f9f;
    margin-top:40px;
    font-size:20px;
}

@media(max-width:900px){

    .hero h1{
        font-size:48px;
    }

    .hero p{
        font-size:17px;
    }

}

</style>
</head>
<body>

<nav>
    <div class="logo">3DByMe</div>
    <a href="#gallery">My Prints</a>
</nav>

<section class="hero">

    <div class="hero-badge">Handmade in New York</div>

    <h1>Custom <span>3D Prints</span><br>Made by Me</h1>

    <p>
        Bookmarks, phone stands, desk decorations, and one-of-a-kind designs —
        each piece designed and printed from scratch.
    </p>

</section>

<section class="gallery" id="gallery">

    <h2 class="section-title">My 3D Prints</h2>

    <div class="grid" id="galleryGrid"></div>

    <div class="loading" id="loadingText">
        Loading projects...
    </div>

</section>

<footer>
    © 2026 3DByMe — Hosted on Vercel
</footer>

<script>

const USERNAME = "maxim1470";
const REPO = "3dbyme";
const BRANCH = "main";

const gallery = document.getElementById("galleryGrid");
const loadingText = document.getElementById("loadingText");

async function loadProjects(){

    let index = 1;
    let foundAnything = false;

    while(true){

        const imageUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${index}.jpg`;
        const imagePngUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${index}.png`;

        const titleUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/ttext${index}.txt`;
        const descUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/dtext${index}.txt`;

        const videoMp4Url = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/video${index}.mp4`;

        let imageFinal = null;

        const jpgCheck = await fetch(imageUrl);
        const pngCheck = await fetch(imagePngUrl);

        if(jpgCheck.ok){
            imageFinal = imageUrl;
        }
        else if(pngCheck.ok){
            imageFinal = imagePngUrl;
        }
        else{
            break;
        }

        foundAnything = true;

        let title = `Project ${index}`;
        let description = "";

        try{
            const titleFetch = await fetch(titleUrl);
            if(titleFetch.ok){
                title = await titleFetch.text();
            }
        }catch{}

        try{
            const descFetch = await fetch(descUrl);
            if(descFetch.ok){
                description = await descFetch.text();
            }
        }catch{}

        let hasVideo = false;

        try{
            const videoCheck = await fetch(videoMp4Url);
            if(videoCheck.ok){
                hasVideo = true;
            }
        }catch{}

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `

            ${hasVideo ? `
            <video controls>
                <source src="${videoMp4Url}" type="video/mp4">
            </video>
            ` : `
            <img src="${imageFinal}">
            `}

            <div class="card-content">
                <h3>${title}</h3>
                <p>${description}</p>
            </div>

        `;

        gallery.appendChild(card);

        index++;
    }

    if(foundAnything){
        loadingText.style.display = "none";
    }
    else{
        loadingText.innerHTML = "No projects found in GitHub repository.";
    }

}

loadProjects();

</script>

</body>
</html>
